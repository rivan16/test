---
- name: LOOPBACK
  hosts: router
  gather_facts: no
  become: yes

  tasks:
    - name: Create LOOPBACK
      ios_command:
        commands:
          - configure terminal
          - int lo 3
          - ip add 3.3.3.3 255.255.255.0
          - no shut
      vars:
        ansible_network_os: ios
